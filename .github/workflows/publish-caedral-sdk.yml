name: Publish caedral JS SDK
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caedral SDK
        uses: actions/checkout@v4
        with:
          repository: trycaedral/caedral
          ref: v1.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm test
        env:
          CI: true
          SKIP_GATEWAY: '1'
      - run: npm run build
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
